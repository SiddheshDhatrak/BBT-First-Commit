name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint 2>/dev/null || echo "No lint script defined"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/unit/core.test.js

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/test-ghost-delivery.js

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t rahatsetu-backend:${{ github.sha }} .
      - name: Test Docker image health check
        run: |
          docker run -d --name test-container -p 3000:3000 rahatsetu-backend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:3000/api/v1/health || exit 1
          curl -f http://localhost:3000/api/v1/ready || exit 1
          docker stop test-container
          docker rm test-container

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        run: npm audit --audit-level=high || true
      - name: Check for secrets
        run: |
          if git log --all --full-history --oneline --source --remotes --tags --grep="secret\|password\|key" | head -5; then
            echo "Potential secrets found in git history"
            exit 1
          fi
name: monorepo-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Frontend CI
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: ''
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint 2>/dev/null || echo "No lint script defined"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: ''
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Backend CI
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: ''
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint 2>/dev/null || echo "No lint script defined"

  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rahatsetu
          POSTGRES_USER: rahatsetu
          POSTGRES_PASSWORD: rahatsetu
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rahatsetu -d rahatsetu"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: ''
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run migrations
        run: |
          DATABASE_URL=postgres://rahatsetu:rahatsetu@localhost:5432/rahatsetu npm run migrate:up
      - run: node tests/unit/core.test.js
        env:
          REPOSITORY_DRIVER: postgres
          DATABASE_URL: postgres://rahatsetu:rahatsetu@localhost:5432/rahatsetu

  backend-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    needs: [backend-lint, backend-unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: ''
      - name: Build Backend Docker image
        run: docker build -t rahatsetu-backend:${{ github.sha }} .
      - name: Verify Docker image exists
        run: docker images rahatsetu-backend:${{ github.sha }}

  # Security
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: ''
      - name: Run npm audit (frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true
      - name: Run npm audit (backend)
        working-directory: ./backend
        run: npm audit --audit-level=high || true
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#rs-tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
